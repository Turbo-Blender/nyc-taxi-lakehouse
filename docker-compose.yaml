services:

  spark:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: nyc-taxi-spark

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT_S3: ${MINIO_ENDPOINT_S3}

    volumes:
      - ./src:/app/src
      - ./data:/app/data

    working_dir: /app

    stdin_open: true
    tty: true

    command: tail -f /dev/null


  minio:
    image: minio/minio:latest

    container_name: minio

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - minio_data:/data

    command: server /data --console-address ":9001"


  postgres:
    image: postgres:16

    container_name: lakehouse-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: warehouse

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  airflow-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow

    container_name: airflow-init

    depends_on:
      - postgres

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/warehouse

      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      _AIRFLOW_WWW_USER_FIRSTNAME: Admin
      _AIRFLOW_WWW_USER_LASTNAME: User
      _AIRFLOW_WWW_USER_ROLE: Admin
      _AIRFLOW_WWW_USER_EMAIL: ${AIRFLOW_ADMIN_EMAIL}

    command: >
      bash -c "
      airflow db migrate
      "

    volumes:
      - ./dags:/opt/airflow/dags


  airflow-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow

    container_name: airflow-webserver

    depends_on:
      - airflow-init

    ports:
      - "8080:8080"

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/warehouse

      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      _AIRFLOW_WWW_USER_FIRSTNAME: Admin
      _AIRFLOW_WWW_USER_LASTNAME: User
      _AIRFLOW_WWW_USER_ROLE: Admin
      _AIRFLOW_WWW_USER_EMAIL: ${AIRFLOW_ADMIN_EMAIL}

    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs

    command: api-server


  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow

    container_name: airflow-scheduler

    depends_on:
      - airflow-init

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/warehouse

    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs

    command: scheduler


volumes:
  minio_data:
  postgres_data:
  airflow_logs: